version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: comicwise-app-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://comicwise:comicwise_pass@postgres:5432/comicwise
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_secure_password
      REDIS_DB: 0
      ENABLE_REDIS_CACHE: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXTAUTH_URL: http://localhost:3000
      ENABLE_EXPERIMENTAL_FEATURES: "true"
      ENABLE_ADMIN_PANEL: "true"
      ENABLE_SEEDING_UI: "true"
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - comicwise-network
    volumes:
      # Bind mount for hot reload
      - ./src:/app/src
      - ./public:/app/public
      - ./pages:/app/pages
      - ./components:/app/components
      - ./.env.local:/app/.env.local
      - /app/node_modules  # Prevent node_modules from being overwritten
      - /app/.next        # Keep .next folder inside container
      - app-logs-dev:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    container_name: comicwise-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: comicwise
      POSTGRES_PASSWORD: comicwise_pass
      POSTGRES_DB: comicwise
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - comicwise-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comicwise -d comicwise"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: comicwise-redis-dev
    restart: unless-stopped
    command: redis-server --requirepass redis_secure_password --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    networks:
      - comicwise-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data-dev:
    driver: local
  redis-data-dev:
    driver: local
  app-logs-dev:
    driver: local

networks:
  comicwise-network:
    driver: bridge
